<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Ilustrasi Hotel dan Penginapan Ramah Muslim di Aceh">
  <defs>
    <linearGradient id="hotelSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B4638"/>
      <stop offset="100%" stop-color="#D9ECE5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#hotelSky)"/>
  <rect y="435" width="800" height="165" fill="#E3ECE9"/>
  <!-- Boutique Syariah Building -->
  <rect x="165" y="160" width="470" height="275" fill="#FFFFFF"/>
  <rect x="150" y="145" width="500" height="22" fill="#0D6E52"/>
