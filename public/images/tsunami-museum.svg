      <stop offset="0%" stop-color="#132A2E"/>
      <stop offset="100%" stop-color="#285E61"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#skyT)"/>
  <rect y="425" width="800" height="175" fill="#E6EEEC"/>
  <!-- Monumental Curved Wave Facade -->
