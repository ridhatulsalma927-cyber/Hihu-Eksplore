    <rect x="225" y="345" width="16" height="80"/>
    <rect x="270" y="345" width="16" height="80"/>
    <rect x="355" y="330" width="90" height="95" rx="45"/>
    <rect x="515" y="345" width="16" height="80"/>
    <rect x="560" y="345" width="16" height="80"/>
    <rect x="605" y="345" width="16" height="80"/>
  </g>
  <!-- Memorial Light Beam -->
  <polygon points="365,245 435,245 460,40 340,40" fill="#F6D88C" opacity="0.16"/>
  <rect x="190" y="460" width="420" height="75" fill="#0F766E" opacity="0.85"/>
