  <path d="M120 285 Q280 235 440 290 T680 255 L680 275 Q440 310 280 255 Q200 265 120 305 Z" fill="#0D6E52" opacity="0.22"/>
  <path d="M120 330 Q280 280 440 335 T680 300 L680 320 Q440 355 280 300 Q200 310 120 350 Z" fill="#0D6E52" opacity="0.32"/>
