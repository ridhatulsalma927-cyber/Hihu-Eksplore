<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Ilustrasi Masjid Raya Baiturrahman dan cakrawala Banda Aceh">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#073B2E"/>
      <stop offset="55%" stop-color="#0E6B53"/>
      <stop offset="100%" stop-color="#D9ECE4"/>
    </linearGradient>
    <linearGradient id="sunGlow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#F6D88C" stop-opacity="0.7"/>
